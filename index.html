<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2A36">
<title>Blue Ember Reiki Academy · App demo</title>
<link rel="icon" href="logo-shield.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Work+Sans:wght@400;500&display=swap">
<style>
html,body{margin:0;height:100%;background:#E8DDC9;color:#0E2A36;font-family:"Work Sans",-apple-system,sans-serif}
body{display:flex;flex-direction:column}
header{background:#0E2A36;color:#FBF7F0;padding:16px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{width:34px;height:auto}
.brand{flex:1;min-width:220px;line-height:1.2}
.brand b{display:block;font:400 26px/1.1 "Cormorant Garamond",Georgia,serif}
.brand b em{color:#8FD0DC}
.brand span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:#8FD0DC}
nav{display:flex;padding:4px;border-radius:999px;border:1px solid rgba(251,247,240,.2);gap:4px}
nav button{border:0;cursor:pointer;min-height:44px;padding:10px 20px;border-radius:999px;font:500 14px "Work Sans",sans-serif;background:transparent;color:#FBF7F0;transition:background 200ms ease}
nav button:hover{background:rgba(42,157,179,.18)}
nav button[aria-pressed="true"]{background:#1E7A8C}
nav button:focus-visible{outline:2px solid #2A9DB3;outline-offset:3px}
iframe{flex:1;width:100%;border:0;display:block}
footer{padding:10px 20px;text-align:center;font-size:12px;color:#4F626A}
@media (max-width:640px){header{padding:10px 14px;gap:10px}header img{width:26px}.brand{min-width:0}.brand b{font-size:20px}.brand span{display:none}nav{width:100%}nav button{flex:1;padding:8px 10px;font-size:13px}footer{display:none}}
</style>
</head>
<body>
<header>
<img src="logo-shield.png" alt="Blue Ember Wellness">
<div class="brand"><b>Blue Ember <em>Reiki Academy</em></b><span>App design demo · sample data only</span></div>
<nav aria-label="Choose app">
<button data-src="student.html" aria-pressed="true">Student app</button>
<button data-src="instructor.html" aria-pressed="false">Mark's instructor app</button>
</nav>
</header>
<iframe id="app" src="student.html" title="App prototype"></iframe>
<footer>A design prototype, not the live app. All people and records are fictional. Instruction, attunements and certification happen only in person at Blue Ember Wellness, Richmond VA.</footer>
<script>
const f=document.getElementById('app'),bs=document.querySelectorAll('nav button');
const pick=src=>{f.src=src;bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.src===src));history.replaceState(null,'','#'+src.replace('.html',''))};
bs.forEach(b=>b.addEventListener('click',()=>pick(b.dataset.src)));
if(location.hash==='#instructor')pick('instructor.html');
</script>
</body>
</html>
